name: Arcion Labs
description: 'Arcion Labs, Inc. built a distributed, in-memory change data capture (CDC)
  platform for real-time enterprise database replication. Its agentless, zero-code
  pipelines replicated data with low latency and high availability across 20+ enterprise
  databases and data warehouses (Oracle, PostgreSQL, MySQL, MongoDB, Snowflake, BigQuery,
  Databricks Delta Lake and more), driven by a YAML CLI, a workflow UI, and an API,
  with built-in schema conversion and evolution. Founded by CTO Rajkumar Sen and later
  led by CEO Gary Hagmueller, and backed by Bessemer Venture Partners and Databricks
  Ventures, Arcion was acquired by Databricks in November 2023 (deal valued at over
  $100M) and its technology now underpins Databricks Lakeflow Connect. This profile
  is retained for network history; the standalone product is no longer independently
  marketed.'
